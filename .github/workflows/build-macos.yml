name: macOS Release Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x86_64
            machtype: x86_64-apple-darwin
            artifact: osx10.6_x86_64_bin
          - os: macos-latest
            arch: arm64
            machtype: arm64-apple-darwin
            artifact: macOS_arm64_bin
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install ftjam
        run: |
          wget -q -O ftjam.tar.gz https://sourceforge.net/projects/freetype/files/ftjam/2.5.2/ftjam-2.5.2.tar.gz/download
          tar -xzf ftjam.tar.gz
          cd ftjam-2.5.2
          make CC="cc -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-int"
          sudo cp bin.*/jam /usr/local/bin/jam
          
      - name: Build ArgyllCMS
        run: |
          export OSTYPE=darwin
          export MACHTYPE=${{ matrix.machtype }}
          export HOSTTYPE=${{ matrix.arch }}
          export CCOPTFLAG="-O0"
          jam -q -fJambase -j1 -sBUILTIN_TIFF=true -sBUILTIN_JPEG=true -sBUILTIN_PNG=true -sBUILTIN_Z=true -sBUILTIN_SSL=true install
          
      - name: Smoke Tests
        env:
          ARGYLL_NOT_INTERACTIVE: "1"
          ARGYLL_EXCLUDE_SERIAL_SCAN: "1"
        run: |
          ./bin/dispcal -? || true
          ./bin/chartread -? || true
          ./bin/colprof -? || true
          ./bin/targen -? || true
          
      - name: Debug GenRMGam Crash on ARM64
        if: matrix.arch == 'arm64'
        run: |
          echo "Compiling GenRMGam with debug symbols..."
          cc -g -O0 -o gamut/GenRMGam_debug gamut/GenRMGam.c gamut/gamut.c gamut/libgamut.a rspl/librspl.a numlib/libnum.a numlib/libui.a xicc/libxicc.a cgats/libcgats.a icc/libicc.a plot/libplot.a plot/libvrml.a yajl/libyajl.a ccast/libccast.a ccast/axTLS/libaxtls.a tiff/libtiff.a jpeg/libjpeg.a png/libpng.a zlib/libz.a spectro/libconv.a -I. -Igamut -Irspl -Inumlib -Ixicc -Icgats -Iicc -Iplot -Iyajl -Iccast -Itiff -Ijpeg -Ipng -Izlib -framework Carbon -framework Cocoa -framework IOKit -framework CoreFoundation -framework AppKit -framework AudioToolbox -lm -lpthread || true
          echo "Running under lldb..."
          lldb -b -o "run gamut/RefMediumGamut.gam" -o "bt all" -o "quit" -- gamut/GenRMGam_debug || true

      - name: Package Release
        run: |
          export OSTYPE=darwin
          export MACHTYPE=${{ matrix.machtype }}
          export HOSTTYPE=${{ matrix.arch }}
          ./makepackagebin.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: argyllcms-${{ matrix.os }}-bin
          path: Argyll_V*_${{ matrix.artifact }}.tgz
